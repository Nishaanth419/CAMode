# Run the image the "Publish image" workflow builds from main, instead of building on the server.
# deploy/update.sh pulls CA_MODE_IMAGE (deploy/.env; default ghcr.io/nishaanth419/camode:main), and tags the
# image it deploys as ca-mode:current. Compose always runs ca-mode:current, so after a rollback a plain
# `docker compose up -d` keeps the image update.sh went back to instead of the one that failed.
# Run deploy/update.sh once before the first `docker compose up` (it creates the tag). docs/hosting.md.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.image.yml:docker-compose.caddy.yml   (in deploy/.env)
services:
  app:
    image: ca-mode:current
    pull_policy: never
