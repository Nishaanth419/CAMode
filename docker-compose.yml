services:
  mcp-agent:
    build: .
    ports:
      - "8003:8080"
    env_file:
      - .env
    environment:
      APP_ORIGIN: http://localhost:8003
      APP_DATA_DIR: /app/.data
      # Same key file the app uses when run with Python, so both can read stored tokens.
      APP_MASTER_KEY_FILE: /run/ca-mode/master.key
    volumes:
      - ./.data:/app/.data
      - ${HOME}/.config/ca-mode:/run/ca-mode
