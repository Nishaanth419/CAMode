name: CI

on:
  push:
  pull_request:
  # deploy.yml runs these checks before deploying.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application and tests
        run: python -m compileall -q app tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Check frontend scripts
        run: for file in frontend/js/*.js frontend/sw.js; do node --check "$file"; done

      - name: Run frontend unit tests
        run: node --test tests/js/*.test.js

      - name: Run code runner unit tests
        run: node --test worker/test/*.test.ts

      - name: Run Cloudflare Worker unit tests
        run: node --test cloudflare/test/*.test.ts
